
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Administrativo | Vitrine Artesanal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f5f3f8;
      color: #272332;
    }
    main { max-width: 850px; margin: auto; }
    h1, h2 { color: #493568; }
    .panel {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 16px;
      box-shadow: 0 4px 18px #24133b10;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 9px;
      border: 1px solid #d9d1e2;
      font: inherit;
    }
    button {
      background: #63448a;
      color: white;
      border: 0;
      font-weight: 650;
      cursor: pointer;
    }
    button.secondary { background: #ece5f4; color: #493568; }
    button.danger { background: #a83250; }
    .product {
      border: 1px solid #e5deec;
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
    }
    .product img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: #f8f6fa;
      border-radius: 8px;
    }
    .hidden { display: none; }
    .hint { color: #665d70; font-size: .9rem; }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Vitrine Artesanal</h1>
  <p class="hint">Painel administrativo</p>

  <section id="loginPanel" class="panel">
    <h2>Entrar</h2>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Senha</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button type="submit">Entrar no painel</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <p id="welcome"></p>
      <button id="logout" class="secondary">Sair da conta</button>
      <p class="hint">
        As alterações são salvas diretamente no Supabase.
      </p>
    </div>

    <div class="panel">
      <h2 id="formTitle">Cadastrar produto</h2>
      <form id="productForm">
        <input id="productId" type="hidden">

        <label for="name">Nome do produto</label>
        <input id="name" maxlength="120" required>

        <label for="category">Categoria</label>
        <input id="category" maxlength="80" required
          placeholder="Ex.: Bolsas, Necessaires">

        <label for="price">Preço (R$)</label>
        <input id="price" type="number" min="0" step="0.01"
          required>

        <label for="description">Descrição</label>
        <textarea id="description" maxlength="3000" rows="4"></textarea>

        <label for="status">Disponibilidade</label>
        <select id="status">
          <option value="available">Disponível</option>
          <option value="made_to_order">Feito sob encomenda</option>
          <option value="sold_out">Esgotado</option>
        </select>

        <label for="photo">Foto do produto</label>
        <input id="photo" type="file"
          accept="image/jpeg,image/png,image/webp">
        <p class="hint">
          JPG, PNG ou WebP. Máximo: 5 MB.
          Ao editar, deixe vazio para manter a foto atual.
        </p>

        <button type="submit">Salvar produto</button>
        <button id="cancelEdit" type="button"
          class="secondary hidden">Cancelar edição</button>
      </form>
    </div>

    <div class="panel">
      <h2>Produtos cadastrados</h2>
      <button id="refresh" class="secondary">Atualizar lista</button>
      <div id="products"></div>
    </div>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./admin.js"></script>
</body>
</html>
